name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  # ============================================
  # 代码检查
  # ============================================
  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}

      - name: Install dependencies
        run: |
          pip install ruff
          # 安装核心依赖（跳过 Windows 专用包）
          grep -v 'pywin32' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Ruff lint
        run: ruff check . --output-format=github

      - name: Ruff format check
        run: ruff format --check .

  # ============================================
  # 语法检查（确保代码可导入）
  # ============================================
  syntax:
    name: Syntax Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install core dependencies
        run: |
          grep -v 'pywin32' requirements.txt > requirements-ci.txt
          pip install -r requirements-ci.txt

      - name: Check syntax (compile all .py files)
        run: |
          python -m compileall agent/ api/ tools/ utils/

      - name: Install test runner
        run: pip install pytest

      - name: Run tests
        run: pytest tests/ -q

  # ============================================
  # Docker 镜像构建验证
  # ============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [lint, syntax]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t multiagent-search .
